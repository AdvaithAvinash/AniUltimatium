# Builds aniultimatium.wgt (tools/build_wgt.py) and aniultimatium.apk (tools/build_apk.py) and attaches them to a DRAFT GitHub release.
# Runs when a tag like "stable-v1.03", "beta-v1.06" or "v1.03" is pushed, or by hand from the Actions tab. beta-* releases are marked "pre-release".
name: Release aniultimatium.wgt

on:
  push:
    tags: ['stable-v*', 'beta-v*', 'v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (created on the selected commit if it does not exist)'
        required: true
        default: 'beta-v1.06'
      draft:
        description: 'Create as a draft (unpublished) release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests and Tizen 4 compatibility check
        run: |
          node --test tests/*.test.js
          python3 tools/check_compat.py

      - name: Build aniultimatium.wgt
        run: |
          python3 tools/build_wgt.py
          unzip -l aniultimatium.wgt
          head -1 public/main.js

      - name: Build aniultimatium.apk (Android TV / Fire TV)
        continue-on-error: true            # a Gradle or SDK hiccup must not block the Samsung release
        run: |
          python3 tools/build_apk.py
          ls -l aniultimatium.apk

      - name: Release name
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="${TAG#stable-}"; NAME="${NAME#beta-}"; PRE=false
          case "$TAG" in stable-*) NAME="Aniultimatium Stable ${NAME}";; beta-*) NAME="Aniultimatium Beta ${NAME}"; PRE=true;; *) NAME="Aniultimatium ${NAME}";; esac
          echo "pre=$PRE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Create release with aniultimatium.wgt
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true' }}
          prerelease: ${{ steps.meta.outputs.pre == 'true' }}
          files: |
            aniultimatium.wgt
            aniultimatium.apk
          body_path: RELEASE_NOTES.md
