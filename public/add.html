<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Add a playlist · Aniultimatium Live TV</title>
<style>
  :root { --bg: #0b0b10; --card: #16161f; --text: #f2f2f7; --muted: #9a9ab0; --accent: #ff3d7f; --ok: #3ddc97; --bad: #ff6b6b; --line: #2a2a38; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 20px 16px;
         background: radial-gradient(1200px 500px at 50% -10%, #25122e 0%, var(--bg) 60%); color: var(--text); font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .card { width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 26px 22px; margin-top: 4vh; }
  h1 { margin: 0 0 4px; font-size: 1.4rem; } h1 b { color: var(--accent); }
  p { color: var(--muted); margin: 0 0 16px; }
  label { display: block; font-size: .82rem; color: var(--muted); margin: 14px 0 5px; text-transform: uppercase; letter-spacing: .06em; }
  input { width: 100%; padding: 13px 14px; font-size: 1rem; border-radius: 10px; border: 2px solid var(--line); background: #0f0f16; color: var(--text); outline: none; }
  input:focus { border-color: var(--accent); }
  #code { font-size: 1.7rem; letter-spacing: .35em; text-align: center; text-transform: uppercase; }
  .tabs { display: flex; margin: 0 0 4px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .tabs button { flex: 1; padding: 11px; border: 0; background: transparent; color: var(--muted); font-size: .95rem; font-weight: 700; cursor: pointer; }
  .tabs button.on { background: var(--accent); color: #fff; }
  .go { width: 100%; margin-top: 20px; padding: 15px; font-size: 1.05rem; font-weight: 800; border: 0; border-radius: 12px; background: var(--accent); color: #fff; cursor: pointer; }
  .go[disabled] { opacity: .5; }
  #msg { margin-top: 14px; min-height: 1.4em; } .ok { color: var(--ok) !important; } .bad { color: var(--bad) !important; }
  small { display: block; margin-top: 18px; color: var(--muted); line-height: 1.45; }
  .hid { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>Add a playlist to your TV</h1>
  <p>Enter the code shown on your TV, then your IPTV provider's details. Nothing is stored after your TV has received it.</p>
  <label for="code">Code from the TV</label>
  <input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC123">
  <label>Playlist type</label>
  <div class="tabs"><button id="tX" class="on" type="button">Xtream login</button><button id="tM" type="button">M3U link</button></div>
  <div id="fX">
    <label for="srv">Server address</label><input id="srv" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="http://provider.example:8080">
    <label for="usr">Username</label><input id="usr" autocapitalize="none" autocomplete="off" spellcheck="false">
    <label for="pwd">Password</label><input id="pwd" autocapitalize="none" autocomplete="off" spellcheck="false">
  </div>
  <div id="fM" class="hid">
    <label for="url">Playlist link (.m3u / .m3u8)</label><input id="url" type="url" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="https://…/playlist.m3u">
  </div>
  <label for="nm">Name (optional)</label><input id="nm" maxlength="60" placeholder="My IPTV">
  <button id="go" class="go" type="button">Send to my TV</button>
  <p id="msg"></p>
  <small>Aniultimatium does not provide channels. Use the playlist or login you got from your own IPTV provider, or pick the free public channels on the TV.</small>
</div>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); }, kind = 'xtream';
  function say(t, c) { $('msg').textContent = t; $('msg').className = c || ''; }
  var q = new URLSearchParams(location.search); if (q.get('code')) $('code').value = q.get('code').toUpperCase();
  function tab(k) { kind = k; $('tX').className = k === 'xtream' ? 'on' : ''; $('tM').className = k === 'm3u' ? 'on' : ''; $('fX').className = k === 'xtream' ? '' : 'hid'; $('fM').className = k === 'm3u' ? '' : 'hid'; }
  $('tX').onclick = function () { tab('xtream'); }; $('tM').onclick = function () { tab('m3u'); };
  $('go').onclick = function () {
    var code = $('code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 6) { say('Enter the 6-character code from your TV.', 'bad'); return; }
    var body = { code: code, kind: kind, name: $('nm').value.trim() };
    if (kind === 'xtream') { body.server = $('srv').value.trim(); body.user = $('usr').value.trim(); body.pass = $('pwd').value.trim(); } else body.url = $('url').value.trim();
    $('go').disabled = true; say('Sending…');
    fetch('/api?action=pair_put', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status); return j; }); })
      .then(function () { say('Done! Your TV is loading the playlist. You can close this page.', 'ok'); })
      .catch(function (e) { say(e.message, 'bad'); $('go').disabled = false; });
  };
})();
</script>
</body>
</html>
